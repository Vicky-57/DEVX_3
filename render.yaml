services:
  - type: web
    name: devx-commerce-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @cartx/shared && npm run build -w @cartx/widget && npm run build -w @cartx/api
    startCommand: node apps/api/dist/seed.js && node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

